  $GODOT_HEAD_INCLUDE
  <style>
    :root { color-scheme: dark; font-family: "Figtree", "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #120e17; color: #eee5e2; }
    body { display: grid; place-items: center; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading-screen { position: fixed; inset: 0; z-index: 2; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 52% 43%, #302333 0%, #1a1420 48%, #100d15 100%); }
    #loading-screen[hidden] { display: none; }
    .card { width: min(420px, 100%); display: grid; justify-items: center; gap: 14px; text-align: center; }
    .mark { width: 90px; height: 90px; object-fit: contain; filter: drop-shadow(0 8px 22px #09070caa); }
    h1 { margin: 0; color: #f3dfc0; font-size: clamp(1.55rem, 5vw, 2.1rem); letter-spacing: .18em; font-weight: 650; }
    p { margin: 0; color: #c7bac8; font-size: .96rem; line-height: 1.55; }
    progress { display: block; width: min(330px, 88vw); height: 9px; appearance: none; border: 0; border-radius: 99px; overflow: hidden; background: #3c3241; }
    progress::-webkit-progress-bar { background: #3c3241; border-radius: 99px; }
    progress::-webkit-progress-value { background: linear-gradient(90deg, #ad8068, #e1bd8c); border-radius: 99px; }
    progress::-moz-progress-bar { background: linear-gradient(90deg, #ad8068, #e1bd8c); border-radius: 99px; }
    #loading-notice { max-width: 340px; min-height: 1.5em; font-size: .87rem; color: #cdb9bf; }
    button { min-width: 150px; min-height: 46px; padding: 10px 18px; border: 1px solid #8f7167; border-radius: 9px; background: #38272d; color: #f6e6d4; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover, button:focus-visible { background: #50343a; outline: 2px solid #d8b58a; outline-offset: 2px; }
    @media (max-width: 560px) { .mark { width: 74px; height: 74px; } h1 { letter-spacing: .12em; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>

      <h1 id="game-title">LORONG SUNYI</h1>
      <p id="loading-status">Menyiapkan kamar sunyi…</p>
      <progress id="loading-progress" aria-label="Kemajuan pemuatan"></progress>
      <p id="loading-notice" hidden></p>
      <button id="loading-retry" type="button" hidden>Coba lagi</button>
    </section>
  </main>
  <script>
    (() => {
      const config = $GODOT_CONFIG;
      const threads = $GODOT_THREADS_ENABLED;
      const canvas = document.getElementById("canvas");
      const loading = document.getElementById("loading-screen");
      const status = document.getElementById("loading-status");
      const progress = document.getElementById("loading-progress");
      const notice = document.getElementById("loading-notice");
      const retry = document.getElementById("loading-retry");
      let failed = false;
      let ready = false;
      let downloaded = 0;
      let lastProgressAt = performance.now();
      const startedAt = lastProgressAt;

      retry.addEventListener("click", () => window.location.reload());

      function stopObserving() {
        clearInterval(watchdog);
        window.removeEventListener("error", onWindowError);
        window.removeEventListener("unhandledrejection", onUnhandledRejection);
      }

      function fail(error) {
        if (failed || ready) return;
        failed = true;
        stopObserving();
        console.error("[lorong-sunyi] Gagal memulai permainan", error);
        loading.hidden = false;
        status.textContent = "Permainan belum dapat dimuat. Periksa koneksi, lalu coba lagi.";
        progress.hidden = true;
        notice.hidden = true;
        retry.hidden = false;
      }

      function onWindowError(event) { fail(event.error || new Error("Kesalahan awal permainan")); }
      function onUnhandledRejection(event) { fail(event.reason || new Error("Persiapan engine gagal")); }

      function updateSlowNotice() {
        if (failed || ready || performance.now() - startedAt < 25000) return;
        notice.hidden = false;
        retry.hidden = false;
        notice.textContent = performance.now() - lastProgressAt >= 25000
          ? "Belum ada kemajuan baru. Kamu bisa tetap menunggu atau mencoba lagi."
          : "Masih menyiapkan permainan. Kamu bisa tetap menunggu atau mencoba lagi.";
      }

      const watchdog = setInterval(updateSlowNotice, 1000);
      window.addEventListener("error", onWindowError);
      window.addEventListener("unhandledrejection", onUnhandledRejection);

      function onProgress(current, total) {
        if (failed || ready) return;
        if (Number.isFinite(current) && current > downloaded) {
          downloaded = current;
          lastProgressAt = performance.now();
        }
        if (!Number.isFinite(total) || total <= 0 || !Number.isFinite(current) || current < 0) {
          progress.removeAttribute("value");
          status.textContent = "Menyiapkan kamar sunyi…";
          return;
        }
        progress.max = total;
        progress.value = Math.min(current, total);
        status.textContent = current >= total ? "Menyalakan lampu kamar…" : `${Math.floor(current / total * 100)}%`;
      }

      async function startGame() {
        try {
          const missing = Engine.getMissingFeatures({ threads });
          if (missing.length) throw new Error(`Fitur peramban tidak tersedia: ${missing.join(", ")}`);
          const engine = new Engine({ ...config, canvas });
          await engine.startGame({ onProgress });
          if (failed) return;
          ready = true;
          stopObserving();
          notice.hidden = true;
          retry.hidden = true;
          requestAnimationFrame(() => requestAnimationFrame(() => {
            if (!failed) loading.hidden = true;
            if (config["focusCanvas"]) canvas.focus();
          }));
        } catch (error) {
          fail(error);
        }
      }

      const script = document.createElement("script");
      script.src = "$GODOT_URL";
      script.addEventListener("load", startGame, { once: true });
      script.addEventListener("error", () => fail(new Error("Berkas engine gagal dimuat")), { once: true });
      document.head.appendChild(script);
    })();
  </script>
