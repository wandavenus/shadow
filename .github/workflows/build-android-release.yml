name: Build APK Rilis Android — Lorong Sunyi

on:
  push:
    branches:
      - main
    paths:
      - "games/lorong-sunyi/**"
      - ".github/workflows/build-android-release.yml"
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: Saya telah meninjau dan menyetujui lisensi Android SDK untuk run ini
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: lorong-sunyi-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Ekspor APK mode rilis
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GAME_DIR: games/lorong-sunyi
      ACCEPT_ANDROID_SDK_LICENSES: ${{ github.event_name == 'push' || inputs.accept_android_sdk_licenses }}
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Periksa media yang wajib untuk game
        run: |
          set -euo pipefail
          required=(
            "assets/environment/desa-kampung-runtime-1280x720.png"
            "assets/characters/desa-hewan/mika-fox-runtime-384x576.png"
            "assets/characters/desa-hewan/pak-ranu-goat-runtime-384x576.png"
            "assets/characters/desa-hewan/bu-sari-cat-runtime-384x576.png"
            "assets/characters/desa-hewan/nara-rabbit-runtime-384x576.png"
            "assets/characters/desa-hewan/pak-jati-bear-runtime-384x576.png"
            "assets/characters/desa-hewan/lio-dog-runtime-384x576.png"
            "assets/share/favicon-fox-runtime-256.png"
            "assets/template/fonts/Figtree-VF.subset.woff2"
            "assets/template/fonts/NotoSansSC-VF.subset.woff2"
            "assets/template/fonts/display/Sora-VF.subset.woff2"
          )
          missing=()
          for item in "${required[@]}"; do
            [[ -s "$GAME_DIR/$item" ]] || missing+=("$item")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Media tidak ditemukan: %s\n' "${missing[@]}"
            echo "::error title=Media runtime belum tersedia::Pastikan semua sumber aset ada di repo; file yang hilang tercantum di atas."
            exit 1
          fi

      - name: Wajibkan persetujuan lisensi Android SDK
        run: |
          if [[ "$ACCEPT_ANDROID_SDK_LICENSES" != "true" ]]; then
            echo "::error title=Persetujuan lisensi diperlukan::Jalankan ulang workflow dan centang input persetujuan lisensi Android SDK."
            exit 1
          fi

      - name: Siapkan Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          accept-android-sdk-licenses: ${{ env.ACCEPT_ANDROID_SDK_LICENSES }}
          log-accepted-android-sdk-licenses: false
          packages: >-
            platform-tools
            build-tools;36.0.0
            platforms;android-35
            platforms;android-36
            cmdline-tools;latest
            cmake;3.22.1
            ndk;29.0.14206865

      - name: Siapkan Godot dan template ekspor
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true

      - name: Konfigurasikan jalur SDK untuk Godot
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/.android/sdk}}"
          [[ -x "$sdk_root/platform-tools/adb" ]] || { echo "::error::Android SDK tidak ditemukan di $sdk_root"; exit 1; }
          settings_dir="${XDG_CONFIG_HOME:-$HOME/.config}/godot"
          mkdir -p "$settings_dir"
          cat > "$settings_dir/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$sdk_root"
          EOF
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          godot --headless --version
          java -version

      - name: Impor resource dan jalankan regresi gameplay/audio
        working-directory: games/lorong-sunyi
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit
          godot --headless --path . res://test/test_suite.tscn
          godot --headless --path . --script res://test/atmosphere_audio_test.gd

      - name: Siapkan signing key APK rilis
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/lorong-sunyi-release.keystore"
          base64_key="${ANDROID_RELEASE_KEYSTORE_BASE64:-}"
          key_password="${ANDROID_RELEASE_KEYSTORE_PASSWORD:-}"
          key_alias="${ANDROID_RELEASE_KEY_ALIAS:-}"
          if [[ -n "$base64_key" || -n "$key_password" || -n "$key_alias" ]]; then
            if [[ -z "$base64_key" || -z "$key_password" || -z "$key_alias" ]]; then
              echo "::error::Untuk signing key tetap, set ketiga secret ANDROID_RELEASE_KEYSTORE_BASE64, ANDROID_RELEASE_KEYSTORE_PASSWORD, dan ANDROID_RELEASE_KEY_ALIAS."
              exit 1
            fi
            echo "::add-mask::$base64_key"
            echo "::add-mask::$key_password"
            echo "::add-mask::$key_alias"
            printf '%s' "$base64_key" | base64 --decode > "$keystore"
            alias="$key_alias"
            password="$key_password"
            echo "Signing key tetap dipakai dari GitHub Actions secrets."
          else
            alias="lorong-sunyi"
            password="$(openssl rand -hex 24)"
            keytool -genkeypair -noprompt \
              -keystore "$keystore" \
              -alias "$alias" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$password" -keypass "$password" \
              -dname "CN=Lorong Sunyi, OU=GitHub Actions, O=wandavenus, C=ID"
            echo "::notice title=Signing key sementara::Build ini memakai signing key sementara. Untuk memasang build berikutnya sebagai pembaruan, tambahkan tiga secret signing key yang dijelaskan di README; jika tidak, hapus instalasi lama terlebih dahulu."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"

      - name: Tetapkan versi build yang meningkat per run
        working-directory: games/lorong-sunyi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("export_presets.cfg")
          text = path.read_text()
          run_number = os.environ["GITHUB_RUN_NUMBER"]
          text, code_count = re.subn(r"(?m)^version/code=\d+$", f"version/code={run_number}", text)
          text, name_count = re.subn(r'(?m)^version/name="[^"]*"$', f'version/name="1.0.{run_number}"', text)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Tidak dapat menetapkan version code/name pada preset Android Release.")
          path.write_text(text)
          PY

      - name: Validasi preset Android sebelum ekspor
        working-directory: games/lorong-sunyi
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          config = Path("export_presets.cfg").read_text()
          android = re.search(r"(?ms)^\[preset\.1\]\n(.*?)(?=^\[preset\.\d+\]|\Z)", config)
          options = re.search(r"(?ms)^\[preset\.1\.options\]\n(.*?)(?=^\[preset\.\d+\]|\Z)", config)
          if not android or 'platform="Android"' not in android.group(1):
              raise SystemExit("Preset Android Release tidak ditemukan atau platform-nya salah.")
          settings = options.group(1) if options else ""
          def option(name):
              match = re.search(rf"(?m)^{re.escape(name)}=(.*)$", settings)
              if not match:
                  raise SystemExit(f"Opsi wajib tidak ditemukan: {name}")
              return match.group(1).strip().strip('"')

          if option("gradle_build/use_gradle_build") != "true":
              raise SystemExit("Preset Android wajib mengaktifkan Gradle Build.")
          if option("gradle_build/min_sdk") != "30":
              raise SystemExit("Preset Android wajib menetapkan minSdk 30.")
          if option("gradle_build/target_sdk") != "35":
              raise SystemExit("Preset Android wajib menetapkan targetSdk 35.")
          if option("gradle_build/export_format") != "0":
              raise SystemExit("Preset Android wajib menghasilkan APK.")
          expected_architectures = {
              "architectures/arm64-v8a": "true",
              "architectures/armeabi-v7a": "false",
              "architectures/x86": "false",
              "architectures/x86_64": "false",
          }
          for name, expected in expected_architectures.items():
              if option(name) != expected:
                  raise SystemExit(f"Arsitektur Android tidak sesuai: {name} harus {expected}.")
          if not re.search(r'(?m)^vram_texture_compression/for_mobile=true$', settings):
              raise SystemExit("Preset Android harus mengaktifkan vram_texture_compression/for_mobile.")
          if not re.search(r'(?m)^vram_texture_compression/for_desktop=false$', settings):
              raise SystemExit("Preset Android harus menonaktifkan kompresi desktop.")
          if not re.search(r'(?m)^textures/vram_compression/import_etc2_astc=true$', settings):
              raise SystemExit("Preset Android harus mengaktifkan ETC2/ASTC texture compression.")
          print("Preset Android tervalidasi: Gradle, minSdk 30, targetSdk 35, APK, arm64-only, dan ETC2/ASTC.")
          PY

      - name: Ekspor APK dengan preset Android Release
        working-directory: games/lorong-sunyi
        run: |
          set -euo pipefail
          mkdir -p build/android
          apk="$GITHUB_WORKSPACE/games/lorong-sunyi/build/android/Lorong-Sunyi-release.apk"
          godot --headless --path . --install-android-build-template --export-release "Android Release" "$apk"
          test -s "$apk"
          python3 tools/verify_android_apk.py "$apk"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$apk"

      - name: Unggah APK sebagai artifact workflow
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lorong-Sunyi-APK-Rilis
          path: games/lorong-sunyi/build/android/Lorong-Sunyi-release.apk
          if-no-files-found: error

      - name: Publikasikan APK ke GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="lorong-sunyi-v1.0.${GITHUB_RUN_NUMBER}"
          apk="games/lorong-sunyi/build/android/Lorong-Sunyi-release.apk"
          gh release create "$tag" "$apk" \
            --draft \
            --title "Lorong Sunyi v1.0.${GITHUB_RUN_NUMBER}" \
            --notes "APK rilis otomatis dari commit ${GITHUB_SHA} pada branch ${GITHUB_REF_NAME}."
